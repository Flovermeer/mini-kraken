<app-page>
  <section class="ion-display-flex ion-flex-column ion-justify-content-center gap-4">
    <h1 class="ion-text-center">Apairer un nouveau cadre</h1>

    <ion-button
      [disabled]="isDiscoveringDevices()"
      (click)="startLookingForDevices()"
    >
      @if (isDiscoveringDevices()) {
        <ion-spinner slot="start" name="crescent"></ion-spinner>
      } @else {
        Chercher des cadres
      }
    </ion-button>

    <ion-list>
      @for(device of discoveredDevices(); track device.id) {
        <ion-item (click)="openFormModal(device)">
          <ion-label>{{ device.name }}</ion-label>
        </ion-item>
      }
    </ion-list>

    @if (isDiscoveringDevices()) {
      <ion-button color="danger" (click)="stopLookingForDevices()">Arrêter la découverte</ion-button>
    }

  </section>

  <ion-modal [isOpen]="isFormModalOpen()"
             [initialBreakpoint]="0.5"
             [breakpoints]="[0, 0.5, 0.85]"
             [backdropDismiss]="false">

    <ng-template>
      <ion-content>
        <ion-title class="ion-text-capitalize ion-text-center ion-padding-top">{{ selectedDevice()?.name }}</ion-title>
        <form novalidate (submit)="onSubmit($event)" class="ion-display-flex ion-flex-column ion-align-items-center gap-4">
          <ion-input [formField]="pairDeviceForm.name"
          label="Nom du cadre"
          label-placement="stacked"
          fill="outline"
          placeholder="{{ selectedDevice()?.name }}"></ion-input>

          <div class="ion-display-flex gap-6">
            <ion-button type="submit">Apairer le cadre</ion-button>
            <ion-button color="danger" (click)="dismissFormModal()">Annuler</ion-button>
          </div>

        </form>
      </ion-content>
    </ng-template>


  </ion-modal>
</app-page>
