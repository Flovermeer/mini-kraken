<app-page>
  @if (isLoading()) {
    <ion-progress-bar [value]="computedPhotosUploadProgress()"></ion-progress-bar>
  }

  <section class="ion-display-flex ion-flex-column ion-justify-content-center gap-4">
    <h1 class="ion-text-center">{{ deviceName }}</h1>

    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      multiple
      (change)="onFileSelected($event)"
    />

    <ion-button expand="block" (click)="fileInput.click()" [disabled]="isLoading()">
      @if (isLoading()) {
        <ion-spinner></ion-spinner>
      } @else {
        Ajouter des photos
      }
    </ion-button>
    <ion-grid class="infinite-scroll-content ion-display-flex ion-flex-column gap-6" role="feed">
      <ion-row>
        @for (thumb of thumbnailsSync(); track thumb.id) {
          <ion-col size="4" >
            <img [src]="'data:image/jpeg;base64,' + thumb.content"
                 (click)="openPhoto(thumb.id)"
                 alt=""
                 class="thumbnail-image"/>
          </ion-col>
        }
      </ion-row>
    </ion-grid>
    <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)" [disabled]="isInfiniteScrollDisabled()">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </section>
</app-page>
<app-photo-gallery-modal
  [(isOpen)]="isPhotoGalleryOpen"
  [(selectedPhotoId)]="selectedPhoto"
  [photoIds]="thumbnailsSync().map(t => t.id)"
  (photoDeleted)="refreshThumbnails()"
></app-photo-gallery-modal>
