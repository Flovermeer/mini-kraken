<app-page>
  @if (isLoading()) {
    <ion-progress-bar [value]="computedPhotosUploadProgress()"></ion-progress-bar>
  }

  <section class="ion-display-flex ion-flex-column ion-justify-content-center gap-4">
    <h1 class="ion-text-center">{{ deviceName }}</h1>

    <input
      #fileInput
      type="file"
      accept="image/*"
      hidden
      multiple
      (change)="onFileSelected($event)"
    />

    <ion-button expand="block" (click)="fileInput.click()" [disabled]="isLoading()">
      @if (isLoading()) {
        <ion-spinner></ion-spinner>
      } @else {
        Sélectionner des photos
      }
    </ion-button>
    <div class="infinite-scroll-content ion-display-flex ion-flex-column ion-align-items-center gap-6" role="feed">
      @for (thumb of thumbnailsSync(); track thumb.id) {
        <img [src]="'data:image/jpeg;base64,' + thumb.content" alt="" width="200" height="200" />
      }
    </div>
    <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)" [disabled]="isInfiniteScrollDisabled()">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </section>
</app-page>
