parameters:
  - name: deviceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
post:
  operationId: uploadPhoto
  tags: [Photos]
  summary: Upload a photo
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
  responses:
    "201":
      description: Photo uploaded successfully
    "400":
      description: Invalid upload
    "404":
      $ref: "../components/responses/not-found.yaml"
    "409":
      $ref: "../components/responses/too-many-files.yaml"
get:
  operationId: getPhotoThumbnails
  tags: [Photos]
  summary: Retrieve a list of thumbnails
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
  responses:
    "200":
      description: List of thumbnails
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/thumbnail.yaml"
    "404":
      $ref: "../components/responses/not-found.yaml"
