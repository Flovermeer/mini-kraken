post:
  operationId: startDiscoveringDevices
  tags: [Devices]
  summary: Launch a 1 minute discovery session
  responses:
    "202":
      description: Discovery started
      content:
        application/json:
          schema:
            type: string
delete:
  operationId: stopDiscoveringDevices
  tags: [Devices]
  summary: Stop a devices discovery process
  responses:
    "202":
      description: Discovery stopped
      content:
        application/json:
          schema:
            type: string
get:
  operationId: getDiscoveredDevices
  tags: [Devices]
  summary: Returns a list of discovered devices
  responses:
    "200":
      description: List of discovered devices
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas/discovered-device.yaml"