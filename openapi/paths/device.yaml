parameters:
  - in: path
    name: id
    schema:
      type: string
    required: true
delete:
  operationId: removeDevice
  tags: [Devices]
  responses:
    "204":
      description: Delete successful
    "404":
      $ref: "../components/responses/not-found.yaml"
patch:
  operationId: updateDevice
  tags: [Devices]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          title: UpdateDeviceRequest
          description: Renommer et/ou déplacer un cadre. Seuls les champs envoyés sont modifiés.
          type: object
          minProperties: 1
          properties:
            name:
              type: string
            placeId:
              type: string
  responses:
    "201":
      description: Update successful
      content:
        application/json:
          schema:
            $ref: "../components/schemas/device.yaml"
    "404":
      $ref: "../components/responses/not-found.yaml"
