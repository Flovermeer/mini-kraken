parameters:
  - name: deviceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - name: id
    in: path
    required: true
    schema:
      type: string
      format: uuid
get:
  operationId: getPhotoById
  tags: [Photos]
  summary: Get a photo by UUID
  responses:
    "200":
      description: Photo binary content
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    "404":
      $ref: "../components/responses/not-found.yaml"
delete:
  operationId: removePhotoById
  tags: [Photos]
  summary: Delete a photo by UUID
  responses:
    "204":
      description: Photo successfully removed
    "404":
      $ref: "../components/responses/not-found.yaml"
