get:
  operationId: getPhotoById
  summary: Get a photo by UUID
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Photo binary content
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/gif:
          schema:
            type: string
            format: binary
        image/bmp:
          schema:
            type: string
            format: binary
    "404":
      description: Photo not found